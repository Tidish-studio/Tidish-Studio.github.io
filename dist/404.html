<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Take the requested path and save it temporarily
      const redirectTo =
        window.location.pathname +
        window.location.search +
        window.location.hash;

      sessionStorage.redirect = redirectTo;
      // Go back to the SPA root
      window.location.replace("/");
    </script>
  </head>
  <body>
    <p>Redirecting…</p>
  </body>
</html>
